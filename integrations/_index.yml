- slug: gitkraken-atlassian-cloud-fortified-apps
  label: Atlassian Cloud Fortified apps
  partner: atlassian
  partner_name: Atlassian Cloud Fortified apps
  category: Cloud Fortified Marketplace publisher
  type: register
  channel: standard-directory
  evidence: https://www.atlassian.com/licensing/marketplace/cloud-fortified
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Atlassian Marketplace REST API, cloudFortifiedStatus=approved per host application
    standard: Atlassian Cloud Fortified
    spec_file: null
    role: cloud-fortified-publisher
    registered_name: GitKraken
    register_country: United States of America
    matched_domain: gitkraken.com
    matched_by: domain
    identity_source: the vendor's own developer-space homepageUrl (no lookup)
    certified_products:
    - product: Cloud Fortified Jira app
      product_type: Cloud Fortified Jira app
      host_application: jira
      certifier: Atlassian (Cloud Fortified apps programme)
      listings: 1
      example_listing: https://marketplace.atlassian.com/apps/4984/git-integration-for-jira-github-gitlab-azure-devops
      lapsed: false
      lapsed_note: the API's cloudFortifiedStatus=approved filter returns only CURRENT approvals; Atlassian publishes
        no lapse list, so no entry is marked lapsed
    signal_note: certified_products = ONE entry per product type (host application of the fortified app), never
      per app; app counts are context
    requirement: https://www.atlassian.com/licensing/marketplace/cloud-fortified
    detected_by: sweep-atlassian-marketplace.py
    detected: '2026-10-21'
  status: not-a-workflow
  arazzo: null
